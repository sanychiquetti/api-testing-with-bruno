info:
  name: rename=-the-emoji
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/emojis/{{emojiId}}"
  body:
    type: json
    data: |-
      {
        "emoji": "🦕",
        "name": "brontosaurus",
        "category": "animals"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("emojiId", res.getBody().id)
    - type: tests
      code: |-
        test("updatedAt moved forward", function () {
          const { createdAt, updatedAt } = res.getBody()

          expect(new Date(updatedAt) > new Date(createdAt)).to.equal(true)
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isNumber
    - expression: res.body.emoji
      operator: eq
      value: 🦕
    - expression: res.body.name
      operator: eq
      value: brontosaurus
    - expression: res.body.category
      operator: eq
      value: animals

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
