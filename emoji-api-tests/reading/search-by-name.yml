info:
  name: search-by-name
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/emojis?search=t-rex"
  params:
    - name: search
      value: t-rex
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('every emoji name is a face', () => {
                  const emojis = res.getBody().emojis
                  
                  emojis.forEach(({ name }) => {
                    expect(name.toLowerCase()).to.include('face')
                  })
                })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.emojis
      operator: isArray
    - expression: res.body.pageInfo
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
