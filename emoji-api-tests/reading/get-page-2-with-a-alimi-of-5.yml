info:
  name: get-page-2-with-a-alimi-of-5
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/emojis?limit=2&page=3"
  params:
    - name: limit
      value: "2"
      type: query
    - name: page
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("totalPages agrees with totalEmojis and the limit",  () => {
                  const { pageInfo } = res.getBody()

                  expect(pageInfo.totalPages).to.equal(Math.ceil(pageInfo.totalEmojis / pageInfo.limit))
                })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.emojis
      operator: isArray
    - expression: res.body.pageInfo
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
