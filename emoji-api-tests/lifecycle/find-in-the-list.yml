info:
  name: find-in-the-list
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/emojis?search=ringed"
  params:
    - name: search
      value: ringed
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("the new emoji appears in the list", function () {
          const ids = res.getBody().emojis.map(({ id }) => id)
          expect(ids).to.include(bru.getVar("lifecycleId"))
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.emojis
      operator: isArray
    - expression: res.body.pageInfo
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
