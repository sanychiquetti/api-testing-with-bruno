info:
  name: emojis-match-the-schema
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/emojis?limit=50"
  params:
    - name: limit
      value: "50"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
